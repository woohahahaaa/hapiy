root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ."
bin = "./tmp/main"
full_bin = "./tmp/main"
include_ext = ["go", "html", "tmpl", "tpl"]
exclude_dir = ["tmp", "web", "logs", "data", "node_modules"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
follow_symlink = false
delay = 600
kill_delay = 500
send_interrupt = true
stop_on_error = true

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
