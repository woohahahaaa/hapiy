<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新建故障转移规则 · 原型</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --border: #e2e2e8;
    --text: #1a1a1f;
    --muted: #71717a;
    --accent: #6366f1;
    --accent-weak: #eef2ff;
    --danger: #dc2626;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 16px;
  }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.35);
    display: grid; place-items: center;
    padding: 24px;
  }
  .dialog {
    background: var(--card);
    border-radius: 14px;
    width: 720px;
    max-width: 100%;
    max-height: calc(100vh - 48px);
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 50px rgba(0,0,0,.18);
    overflow: hidden;
  }
  .dialog-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .dialog-head h1 { font-size: 16px; font-weight: 600; }
  .close { width: 28px; height: none; border: none; background: transparent; border-radius: 6px; cursor: pointer; font-size: 16px; color: var(--muted); }
  .close:hover { background: #f0f0f2; color: var(--text); }

  .dialog-body { padding: 4px 20px 8px; overflow-y: auto; }

  .section { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .section:last-of-type { border-bottom: none; }
  .section-title { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; margin-bottom: 10px; }
  .section-num {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent-weak); color: var(--accent);
    font-size: 11px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .section-hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .row label.lbl { font-size: 12.5px; color: var(--text); }
  .row .sub { font-size: 12px; color: var(--muted); }
  .grow { flex: 1; min-width: 140px; }

  input[type="text"], input[type="number"], select, textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 13px;
    background: #fff;
    color: var(--text);
    outline: none;
    font-family: inherit;
  }
  input[type="number"] { height: 32px; padding: 0 10px; }
  textarea { min-height: 96px; resize: vertical; line-height: 1.55; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
  input:disabled, select:disabled, textarea:disabled { background: #f6f6f7; color: var(--muted); cursor: not-allowed; }

  /* 故障转移 rows */
  .ft-list { display: flex; flex-direction: column; gap: 8px; }
  .ft-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 10px 10px 8px;
    background: #fafafa;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: default;
  }
  .ft-row.dragging { opacity: .55; border-style: dashed; border-color: var(--accent); }
  .ft-handle {
    flex: none; width: 22px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); cursor: grab; user-select: none;
    font-size: 16px; border-radius: 4px;
  }
  .ft-handle:hover { color: var(--text); background: #eeeef1; }
  .ft-handle:active { cursor: grabbing; }
  .ft-index {
    flex: none; width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent-weak); color: var(--accent);
    font-size: 11px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .ft-unit-label {
    flex: none; min-width: 132px;
    padding: 6px 10px;
    background: #eef2ff; color: var(--accent);
    border-radius: 7px;
    font-size: 12.5px; font-weight: 500;
    white-space: nowrap;
  }
  .ft-opts { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; flex-wrap: wrap; }
  .ft-opt { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; user-select: none; cursor: pointer; }
  .ft-opt input[type="checkbox"] { width: auto; }
  .ft-retry { width: 60px; padding: 4px 8px; height: 28px; margin-left: 4px; }

  .dialog-foot {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 10px;
    background: #fcfcfd;
  }
  .btn {
    height: 34px; padding: 0 18px; border-radius: 8px;
    font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: #fff;
  }
  .btn:hover { background: #f2f2f4; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.05); }

  .prototype-badge {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    background: #111; color: #fff; font-size: 11px; padding: 5px 12px; border-radius: 999px;
    letter-spacing: .5px;
  }
</style>
</head>
<body>
<div class="prototype-badge">静态原型 · 仅表单界面</div>

<div class="overlay">
  <div class="dialog">
    <div class="dialog-head">
      <h1>新建故障转移规则</h1>
      <button class="close" title="关闭">✕</button>
    </div>

    <div class="dialog-body">

      <!-- 0 基本信息 -->
      <div class="section">
        <div class="section-title"><span class="section-num">0</span>基本信息</div>
        <div class="row">
          <label class="lbl" for="f-name">规则名称 <span style="color:var(--danger)">*</span></label>
          <input class="grow" type="text" id="f-name" placeholder="如：429 限流自动转移">
        </div>
        <div class="section-hint">执行顺序 = 规则在「故障转移插槽」中的排列顺序，可拖动调整</div>
      </div>

      <!-- 1 触发条件：纯关键字匹配，多行 OR -->
      <div class="section">
        <div class="section-title"><span class="section-num">1</span>触发条件</div>
        <div class="row" style="margin-bottom:8px">
          <span class="sub">一行一个关键字 / 错误码 / 关键词，任一行匹配即触发（普通字符匹配）</span>
        </div>
        <textarea id="f-kw" placeholder="例如：
429
rate_limit_exceeded
quota
context_length_exceeded">429
rate_limit_exceeded
context_length_exceeded</textarea>
      </div>

      <div class="section">
        <div class="section-title"><span class="section-num">2</span>故障转移</div>
        <div class="row" style="margin-bottom:8px">
          <span class="sub">三行固定（Base URL / Key / 供应商），可拖动排序；行字段含义相同</span>
        </div>
        <div class="ft-list" id="ft-list"></div>
      </div>

    </div>

    <div class="dialog-foot">
      <button class="btn" type="button">取消</button>
      <button class="btn btn-primary" type="button">保存规则</button>
    </div>
  </div>
</div>

<script>
const DEFAULT_UNITS = [
    { key: 'base_url', label: 'Base URL' },
    { key: 'key',      label: 'Key' },
    { key: 'provider', label: '供应商' }
  ];

  function rowTemplate(idx, unit, opts, retry) {
    opts = opts || { retry: 3, rotate: true, disable: true };
    retry = (retry === undefined || retry === null) ? 3 : retry;
    return `
      <div class="ft-row" draggable="true" data-unit="${unit.key}">
        <div class="ft-handle" title="拖动排序">⋮⋮</div>
        <div class="ft-index">${idx + 1}</div>
        <div class="ft-unit-label">${unit.label}</div>
        <div class="ft-opts">
          <label class="ft-opt">重试次数
            <input type="number" class="ft-retry" value="${retry}" min="1">
          </label>
          <label class="ft-opt"><input type="checkbox" data-opt="rotate"${opts.rotate?' checked':''}> 自动轮询</label>
          <label class="ft-opt"><input type="checkbox" data-opt="disable"${opts.disable?' checked':''}> 自动禁用</label>
        </div>
      </div>`;
  }

  function renderRows() {
    const list = document.getElementById('ft-list');
    list.innerHTML = '';
    DEFAULT_UNITS.forEach((u, i) => {
      const div = document.createElement('div');
      div.innerHTML = rowTemplate(i, u);
      list.appendChild(div.firstElementChild);
    });
    bindRowEvents();
    renumber();
  }

  function renumber() {
    document.querySelectorAll('#ft-list .ft-row').forEach((row, i) => {
      const idx = row.querySelector('.ft-index');
      if (idx) idx.textContent = i + 1;
    });
  }

  function bindRowEvents() {
    const list = document.getElementById('ft-list');
    list.querySelectorAll('.ft-row').forEach(row => {
      row.addEventListener('dragstart', e => {
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', 'ft-row');
      });
      row.addEventListener('dragend', () => {
        row.classList.remove('dragging');
      });
      row.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const rect = row.getBoundingClientRect();
        const after = (e.clientY - rect.top) > rect.height / 2;
        if (after) row.parentNode.insertBefore(row, row.nextSibling);
        else row.parentNode.insertBefore(row, row.previousSibling);
        renumber();
      });
    });
  }

  renderRows();
</script>
</body>
</html>
