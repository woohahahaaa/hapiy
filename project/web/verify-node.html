<!doctype html>
<html lang="zh" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>node verify</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #181818;
      }
      /* 冻结 flash 关键帧在 50%（发光最亮的一帧），方便对比圆角 */
      .verify-freeze * {
        animation-play-state: paused !important;
        animation-delay: -170ms !important;
      }
      #out {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        max-height: 46vh;
        overflow: auto;
        background: #000;
        color: #ddd;
        font-size: 12px;
        padding: 8px;
        white-space: pre;
        z-index: 50;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <pre id="out"></pre>
    <script type="module" src="/src/__verify__/main.tsx"></script>
  </body>
</html>
